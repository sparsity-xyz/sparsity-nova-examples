version: v1
name: sqlite-tee
target: sqlite-tee:latest
sources:
  app: .
defaults:
  cpu_count: 2
  memory_mb: 1024
ingress:
  - listen_port: 8080
api:
  listen_port: 18000
aux_api:
  listen_port: 18001
storage:
  mounts:
    - name: appdata
      mount_path: /mnt/appdata
      required: true
      size_mb: 128
